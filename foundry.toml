[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path  = 'cache_forge'
# match hardhat.config.ts so forge compiles the same bytecode the protocol ships
solc = '0.8.34'
via_ir = true
optimizer = true
optimizer_runs = 100
remappings = [
    'forge-std/=lib/forge-std/src/',
    '@openzeppelin/=node_modules/@openzeppelin/',
]

# default fuzz iterations; override per-run with `forge test --fuzz-runs N`
[fuzz]
runs = 1000
