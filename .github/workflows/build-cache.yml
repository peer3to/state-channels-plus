name: Build cache

# PR runs can restore caches saved on their base branch, but CI runs only on
# pull requests. This saves dispute's build so every PR into dispute starts from it.
on:
    push:
        branches:
            - dispute

# a newer push supersedes the running build; a cancelled run saves nothing
concurrency:
    group: build-cache-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 20
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Read the pinned Foundry version
              id: forge
              run: echo "version=$(cat .forge-version)" >> "$GITHUB_OUTPUT"

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
              with:
                  version: ${{ steps.forge.outputs.version }}

            - name: Restore the Foundry build
              id: forge-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      out
                      cache_forge
                  key: forge-${{ steps.forge.outputs.version }}-${{ hashFiles('foundry.toml', 'yarn.lock', 'contracts/**/*.sol', 'test/**/*.sol', 'lib/forge-std/src/**') }}
                  restore-keys: forge-${{ steps.forge.outputs.version }}-

            - name: Restore the contract and test-tree build
              id: build-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      artifacts
                      cache
                      typechain-types
                      dist
                      src/utils/GeneratedArtifacts.ts
                  key: build-${{ hashFiles('yarn.lock', 'hardhat.config.ts', 'tsconfig.json', 'contracts/**/*.sol') }}-${{ github.sha }}
                  restore-keys: build-${{ hashFiles('yarn.lock', 'hardhat.config.ts', 'tsconfig.json', 'contracts/**/*.sol') }}-

            - name: Build contracts, the compiled test tree and forge
              run: yarn test:parallel:prepare

            - name: Save the Foundry build
              if: steps.forge-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      out
                      cache_forge
                  key: ${{ steps.forge-cache.outputs.cache-primary-key }}

            - name: Save the contract and test-tree build
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      artifacts
                      cache
                      typechain-types
                      dist
                      src/utils/GeneratedArtifacts.ts
                  key: ${{ steps.build-cache.outputs.cache-primary-key }}
