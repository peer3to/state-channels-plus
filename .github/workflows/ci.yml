name: CI - Distributed Test Suite

on:
    pull_request:
        branches:
            - master
            - dispute
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: distributed-test-pool
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.2.3
                  cache: true

            - name: Cache compiled contracts and typechain output
              id: hardhat-cache
              uses: actions/cache@v4
              with:
                  path: |
                      cache
                      artifacts
                      typechain-types
                      src/utils/GeneratedArtifacts.ts
                  key: hardhat-artifacts-${{ hashFiles('contracts/**/*.sol', 'hardhat.config.ts', 'package.json', 'yarn.lock') }}

            # Mocha test discovery imports every test file to enumerate its
            # real describe/it tree, and those files import typechain types,
            # so compiled contracts must exist before discovery runs. `yarn
            # compile` always does a clean --force rebuild, so only run it
            # when the sources it depends on actually changed.
            - name: Compile contracts and generate artifacts
              if: steps.hardhat-cache.outputs.cache-hit != 'true'
              run: yarn compile

            - name: Check distributed pool secrets are present
              env:
                  SCP_TEST_POOL_SECRET: ${{ secrets.SCP_TEST_POOL_SECRET }}
                  SCP_TEST_ORCHESTRATOR_SEED: ${{ secrets.SCP_TEST_ORCHESTRATOR_SEED }}
              run: |
                  if [ -z "$SCP_TEST_POOL_SECRET" ]; then
                    echo "::error::SCP_TEST_POOL_SECRET is not set. Set it with: gh secret set SCP_TEST_POOL_SECRET"
                    exit 1
                  fi
                  if ! printf '%s' "$SCP_TEST_ORCHESTRATOR_SEED" | grep -Eq '^[a-f0-9]{64}$'; then
                    echo "::error::SCP_TEST_ORCHESTRATOR_SEED must be a 64-character lowercase hex repository secret"
                    exit 1
                  fi

            - name: Run full test suite on the distributed pool
              env:
                  SCP_TEST_POOL_SECRET: ${{ secrets.SCP_TEST_POOL_SECRET }}
                  SCP_TEST_ORCHESTRATOR_SEED: ${{ secrets.SCP_TEST_ORCHESTRATOR_SEED }}
              run: yarn test:parallel:distributed --discovery-timeout 300000

            - name: Upload run logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: distributed-run-logs
                  path: ./logs/
                  if-no-files-found: ignore
                  retention-days: 7
