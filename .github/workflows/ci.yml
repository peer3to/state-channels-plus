name: CI - Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dispute

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile
        run: yarn compile

      - name: Run tests
        run: npx nyc  --silent --temp-dir "./nyc_output"  yarn test
      # ideally this shoud run in a merge queue, but we don't have that yet
      - name: Run e2e tests
        run: npx nyc  --silent --no-clean --temp-dir "./nyc_output" yarn test:e2e

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nyc-raw-output
          path: ./nyc_output/
  coverage-report:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: nyc-raw-output
          path: ./nyc_output/
      - name: coverage summary
        run: npx nyc report --temp-dir=.nyc_output   --reporter=text-summary
      - name: coverage details
        run: npx nyc report --temp-dir=.nyc_output --reporter=text
