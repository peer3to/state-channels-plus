name: CI - Distributed Test Suite

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: distributed-test-pool
    cancel-in-progress: false

jobs:
    spec:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Check spec ID links
              run: yarn spec:ids:check

            - name: Check spec change impact
              run: yarn spec:impact --base origin/${{ github.base_ref }}

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Check import order
              run: yarn lint:imports

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.2.3

            - name: Check Solidity formatting
              run: forge fmt --check

            - name: Check distributed pool secrets are present
              env:
                  SCP_TEST_POOL_SECRET: ${{ secrets.SCP_TEST_POOL_SECRET }}
                  SCP_TEST_ORCHESTRATOR_SEED: ${{ secrets.SCP_TEST_ORCHESTRATOR_SEED }}
              run: |
                  if [ -z "$SCP_TEST_POOL_SECRET" ]; then
                    echo "::error::SCP_TEST_POOL_SECRET is not set. Set it with: gh secret set SCP_TEST_POOL_SECRET"
                    exit 1
                  fi
                  if ! printf '%s' "$SCP_TEST_ORCHESTRATOR_SEED" | grep -Eq '^[a-f0-9]{64}$'; then
                    echo "::error::SCP_TEST_ORCHESTRATOR_SEED must be a 64-character lowercase hex repository secret"
                    exit 1
                  fi

            - name: Compile contracts and generated artifacts
              run: yarn compile

            - name: Run full test suite on the distributed pool
              env:
                  SCP_TEST_POOL_SECRET: ${{ secrets.SCP_TEST_POOL_SECRET }}
                  SCP_TEST_ORCHESTRATOR_SEED: ${{ secrets.SCP_TEST_ORCHESTRATOR_SEED }}
              run: yarn test:parallel:distributed --discovery-timeout 300000

            - name: Upload run logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: distributed-run-logs
                  path: ./logs/
                  if-no-files-found: ignore
                  retention-days: 7

    browser:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "yarn"
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Install Chromium and system dependencies
              run: yarn playwright install --with-deps chromium
            - name: Install the distributed runner's pinned Forge binary
              run: |
                  foundry_image=$(sed -n 's/^ARG FOUNDRY_IMAGE=//p' scripts/e2e-parallel/distributed/runner-image.Dockerfile)
                  foundry_container=$(docker create "$foundry_image")
                  trap 'docker rm "$foundry_container"' EXIT
                  mkdir -p "$RUNNER_TEMP/foundry"
                  docker cp "$foundry_container:/usr/local/bin/forge" "$RUNNER_TEMP/foundry/forge"
                  chmod +x "$RUNNER_TEMP/foundry/forge"
                  echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
            - name: Compile contracts and generated artifacts
              run: yarn compile
            - name: Verify browser workers
              run: yarn test:browser:worker
            - name: Verify direct and nested WebRTC
              run: yarn test:browser:webrtc
            - name: Upload browser logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: browser-run-logs
                  path: ./logs/
                  if-no-files-found: ignore
                  retention-days: 7
