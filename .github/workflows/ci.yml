name: CI - Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dispute

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.1.0

      - name: Compile
        run: yarn compile

      - name: Run tests
        run: yarn test

      - name: Lint
        run: yarn lint:fix-only
