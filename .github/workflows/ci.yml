name: CI - Distributed Test Suite

on:
    push:
        branches:
            - master
            - dispute
    pull_request:
        branches:
            - master
            - dispute
    workflow_dispatch:

concurrency:
    group: distributed-test-pool-${{ github.ref }}
    cancel-in-progress: true

jobs:
    host-lock-linux:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run host-lock process tests
              run: yarn test:parallel --no-forge --slots 0 --test-pattern scripts/e2eParallelWorkerLease.test.ts --grep "host lock|one process recover|releases in one process|pid-file"

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.2.3

            - name: Compile contracts and generate artifacts
              run: yarn compile

            - name: Check pool secret is present
              env:
                  SCP_TEST_POOL_SECRET: ${{ secrets.SCP_TEST_POOL_SECRET }}
              run: |
                  if [ -z "$SCP_TEST_POOL_SECRET" ]; then
                    echo "::error::SCP_TEST_POOL_SECRET is not set. Set it with: gh secret set SCP_TEST_POOL_SECRET"
                    exit 1
                  fi

            - name: Run full test suite on the distributed pool
              env:
                  SCP_TEST_POOL_SECRET: ${{ secrets.SCP_TEST_POOL_SECRET }}
              run: yarn test:parallel:distributed --discovery-timeout 300000

            - name: Upload run logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: distributed-run-logs
                  path: ./logs/
                  if-no-files-found: ignore
                  retention-days: 7
