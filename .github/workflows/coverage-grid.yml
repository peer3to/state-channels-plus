# Verifies the subsystem coverage reports: every scenario tag must be valid
# against its domain, and the committed *.generated.md files must be fresh.
# (The HTML dashboard / gh-pages deploy returns once it is rebuilt over the
# per-subsystem data model.)

name: Coverage Grid

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn

      - run: yarn coverage:grid

      - name: Generated reports are committed and fresh
        run: git diff --exit-code test/unit
