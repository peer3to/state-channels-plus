name: Coverage Grid → GH Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn

      - run: yarn coverage:grid

      - name: Collect output
        run: |
          mkdir -p dist
          cp test/V1/COVERAGE_GRID.generated.html dist/index.html
          [ -f test/V1/echarts.min.js ] && cp test/V1/echarts.min.js dist/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
